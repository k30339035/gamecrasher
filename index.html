<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Destruction - 3D Game</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- UI Overlay -->
        <div id="ui-overlay">
            <div id="hud">
                <div class="hud-item">
                    <span class="label">Level:</span>
                    <span id="level-display">1</span>
                </div>
                <div class="hud-item">
                    <span class="label">Score:</span>
                    <span id="score-display">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">Blocks:</span>
                    <span id="blocks-display">0/0</span>
                </div>
            </div>

            <div id="level-complete" class="modal hidden">
                <div class="modal-content">
                    <h2>Level Complete!</h2>
                    <p>Score: <span id="level-score">0</span></p>
                    <button id="next-level-btn">Next Level</button>
                </div>
            </div>

            <div id="game-over" class="modal hidden">
                <div class="modal-content">
                    <h2>Game Complete!</h2>
                    <p>Final Score: <span id="final-score">0</span></p>
                    <button id="restart-btn">Play Again</button>
                </div>
            </div>

            <div id="start-screen" class="modal">
                <div class="modal-content">
                    <h1>Building Destruction</h1>
                    <p>Click on buildings to destroy them!</p>
                    <p>Complete all 10 levels to win</p>
                    <button id="start-btn">Start Game</button>
                </div>
            </div>
        </div>

        <div id="instructions">
            <p>🖱️ Click/Touch blocks to destroy them</p>
            <p>🎯 Destroy all blocks to advance</p>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
